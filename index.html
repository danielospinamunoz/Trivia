<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Multijugador Online 1v1</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS WebRTC P2P CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes spinWheel {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(1800deg); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // BANCO DE PREGUNTAS POR CATEGORÍA
    const CATEGORIES = [
      { id: 'cultura', name: 'Cultura General', color: 'from-amber-500 to-orange-600' },
      { id: 'matematicas', name: 'Matemáticas', color: 'from-blue-500 to-indigo-600' },
      { id: 'ciencias', name: 'Ciencias', color: 'from-emerald-500 to-teal-600' },
      { id: 'deporte', name: 'Deportes', color: 'from-rose-500 to-red-600' }
    ];

    const QUESTION_BANK = {
      cultura: [
        { question: "¿Cuál es el país más grande del mundo por superficie?", options: ["Canadá", "China", "Rusia", "Estados Unidos"], answer: 2 },
        { question: "¿En qué año llegó el ser humano a la Luna?", options: ["1965", "1969", "1972", "1959"], answer: 1 },
        { question: "¿Quién pintó la Mona Lisa?", options: ["Vincent van Gogh", "Pablo Picasso", "Leonardo da Vinci", "Michelangelo"], answer: 2 },
        { question: "¿Cuál es la capital de Japón?", options: ["Kioto", "Osaka", "Tokio", "Hiroshima"], answer: 2 },
        { question: "¿Qué idioma tiene más hablantes nativos en el mundo?", options: ["Inglés", "Español", "Chino Mandarín", "Hindi"], answer: 2 }
      ],
      matematicas: [
        { question: "¿Cuál es la raíz cuadrada de 144?", options: ["10", "11", "12", "14"], answer: 2 },
        { question: "¿Cuánto es 7 x 8?", options: ["54", "56", "62", "48"], answer: 1 },
        { question: "¿Cómo se llama un polígono de 8 lados?", options: ["Hexágono", "Heptágono", "Octágono", "Decágono"], answer: 2 },
        { question: "Si un triángulo tiene ángulos de 90° y 45°, ¿cuánto mide el tercero?", options: ["45°", "60°", "30°", "90°"], answer: 0 },
        { question: "Resuelve: 2 + 3 x 4", options: ["20", "14", "18", "12"], answer: 1 }
      ],
      ciencias: [
        { question: "¿Cuál es el elemento químico con símbolo 'O'?", options: ["Oro", "Osmo", "Oxígeno", "Oganesón"], answer: 2 },
        { question: "¿Qué planeta es conocido como el 'Planeta Rojo'?", options: ["Júpiter", "Venus", "Marte", "Saturno"], answer: 2 },
        { question: "¿Cuál es el órgano más grande del cuerpo humano?", options: ["Hígado", "Cerebro", "Piel", "Corazón"], answer: 2 },
        { question: "¿Qué gas absorben las plantas para la fotosíntesis?", options: ["Oxígeno", "Dióxido de Carbono", "Nitrógeno", "Hidrógeno"], answer: 1 },
        { question: "¿Cuál es la velocidad aproximada de la luz?", options: ["300,000 km/s", "150,000 km/s", "1,000,000 km/s", "50,000 km/s"], answer: 0 }
      ],
      deporte: [
        { question: "¿Cada cuántos años se celebran los Juegos Olímpicos?", options: ["2 años", "3 años", "4 años", "5 años"], answer: 2 },
        { question: "¿Cuántos jugadores de fútbol hay en campo por equipo?", options: ["9", "10", "11", "12"], answer: 2 },
        { question: "¿En qué deporte se utiliza el término 'Home Run'?", options: ["Béisbol", "Baloncesto", "Tenis", "Golf"], answer: 0 },
        { question: "¿Cuánto dura un partido de fútbol profesional sin prórroga?", options: ["80 min", "90 min", "100 min", "60 min"], answer: 1 },
        { question: "¿En qué país se inventó el baloncesto?", options: ["Canadá", "Estados Unidos", "Inglaterra", "Grecia"], answer: 1 }
      ]
    };

    function App() {
      const [myName, setMyName] = useState('');
      const [rivalName, setRivalName] = useState('');
      const [roomId, setRoomId] = useState('');
      const [inputRoomCode, setInputRoomCode] = useState('');
      const [status, setStatus] = useState('lobby'); // lobby, waiting, choosing, answering, result, finished
      
      const [myScore, setMyScore] = useState(0);
      const [rivalScore, setRivalScore] = useState(0);

      const [myCategory, setMyCategory] = useState(null);
      const [rivalCategory, setRivalCategory] = useState(null);
      const [mySelectionType, setMySelectionType] = useState(null); // 'chosen' | 'random'
      
      const [myQuestion, setMyQuestion] = useState(null);
      const [myAnswer, setMyAnswer] = useState(null); // opción seleccionada temporalmente
      const [rivalAnswer, setRivalAnswer] = useState(null);
      const [isConfirmed, setIsConfirmed] = useState(false); // confirma envío definitivo

      const [timer, setTimer] = useState(15);
      const [isSpinning, setIsSpinning] = useState(false);
      const [wheelRotation, setWheelRotation] = useState(0);
      const [copied, setCopied] = useState(false);

      const peerRef = useRef(null);
      const connRef = useRef(null);

      // CREAR SALA P2P
      const createRoom = () => {
        const name = myName.trim() || 'Anfitrión';
        setMyName(name);
        const code = Math.random().toString(36).substring(2, 8).toUpperCase();
        const peerId = 'trivia-room-' + code;

        const peer = new Peer(peerId);
        peerRef.current = peer;

        peer.on('open', () => {
          setRoomId(code);
          setStatus('waiting');
        });

        peer.on('connection', (conn) => {
          connRef.current = conn;
          conn.on('open', () => {
            conn.send({ type: 'INIT', name });
          });
          conn.on('data', (data) => handleIncomingData(data, name));
        });

        peer.on('error', (err) => {
          console.error("Error Peer:", err);
          alert("Error de conexión. Inténtalo de nuevo.");
        });
      };

      // UNIRSE A SALA P2P
      const joinRoom = () => {
        const name = myName.trim() || 'Jugador 2';
        setMyName(name);
        const code = inputRoomCode.trim().toUpperCase();
        if (!code) return;

        const peer = new Peer();
        peerRef.current = peer;

        peer.on('open', () => {
          const conn = peer.connect('trivia-room-' + code);
          connRef.current = conn;

          conn.on('open', () => {
            setRoomId(code);
            conn.send({ type: 'INIT', name });
            setStatus('choosing');
          });

          conn.on('data', (data) => handleIncomingData(data, name));
        });

        peer.on('error', (err) => {
          alert("No se pudo conectar a la sala. Verifica el código.");
        });
      };

      // MANEJO DE MENSAJES DE RED
      const handleIncomingData = (data, name) => {
        if (data.type === 'INIT') {
          setRivalName(data.name);
          setStatus('choosing');
        }
        if (data.type === 'CATEGORY_CHOSEN') {
          setRivalCategory(data.category);
        }
        if (data.type === 'ANSWER_SUBMITTED') {
          setRivalAnswer(data.answer);
          if (data.score !== undefined) {
            setRivalScore(data.score); // Actualización inmediata del puntaje del rival
          }
        }
        if (data.type === 'NEXT_ROUND') {
          startNextRoundLocal();
        }
      };

      // ELEGIR CATEGORÍA INDIVIDUALMENTE
      const chooseCategory = (catId, selectionType) => {
        setMyCategory(catId);
        setMySelectionType(selectionType);
        const list = QUESTION_BANK[catId];
        const q = list[Math.floor(Math.random() * list.length)];
        setMyQuestion(q);

        if (connRef.current) {
          connRef.current.send({ type: 'CATEGORY_CHOSEN', category: catId });
        }
      };

      // GIRAR RULETA ALEATORIA GRATIS (0 PTS PENALIZACIÓN)
      const spinRoulette = () => {
        if (isSpinning) return;
        setIsSpinning(true);
        const randomIdx = Math.floor(Math.random() * CATEGORIES.length);
        const targetCat = CATEGORIES[randomIdx];

        setWheelRotation(prev => prev + 1800 + (360 - (randomIdx * 90 + 45)));

        setTimeout(() => {
          setIsSpinning(false);
          chooseCategory(targetCat.id, 'random');
        }, 2000);
      };

      // AMBOS ELIGIERON SU TEMA -> PASAN A RESPONDER SIMULTÁNEAMENTE
      useEffect(() => {
        if (myCategory && rivalCategory && status === 'choosing') {
          setStatus('answering');
          setTimer(15);
          setIsConfirmed(false);
        }
      }, [myCategory, rivalCategory, status]);

      // CRONÓMETRO DE 15 SEGUNDOS
      useEffect(() => {
        let t = null;
        if (status === 'answering' && timer > 0) {
          t = setInterval(() => setTimer(prev => prev - 1), 1000);
        } else if (timer === 0 && status === 'answering' && !isConfirmed) {
          confirmFinalAnswer();
        }
        return () => clearInterval(t);
      }, [status, timer, isConfirmed, myAnswer]);

      // SELECCIONAR / CAMBIAR OPCIÓN TEMPORALMENTE
      const selectOption = (optIdx) => {
        if (isConfirmed) return;
        setMyAnswer(optIdx);
      };

      // CONFIRMAR RESPUESTA DEFINITIVA Y ENVIAR AL RIVAL
      const confirmFinalAnswer = () => {
        setIsConfirmed(true);
        const finalAns = myAnswer !== null ? myAnswer : -1;
        
        let newMyScore = myScore;
        if (myQuestion && finalAns === myQuestion.answer) {
          newMyScore += 1;
        } else if (mySelectionType === 'chosen' && finalAns !== -1) {
          newMyScore = Math.max(0, newMyScore - 1);
        }
        setMyScore(newMyScore);

        if (connRef.current) {
          connRef.current.send({ 
            type: 'ANSWER_SUBMITTED', 
            answer: finalAns,
            score: newMyScore 
          });
        }
      };

      // EVALUACIÓN DE FIN DE RONDA CUANDO AMBOS RESPONDEN
      useEffect(() => {
        if (isConfirmed && rivalAnswer !== null && status === 'answering') {
          if (myScore >= 5 || rivalScore >= 5) {
            setStatus('finished');
          } else {
            setStatus('result');
          }
        }
      }, [isConfirmed, rivalAnswer, myScore, rivalScore, status]);

      // REINICIAR DATOS PARA LA SIGUIENTE RONDA
      const startNextRoundLocal = () => {
        setMyCategory(null);
        setRivalCategory(null);
        setMySelectionType(null);
        setMyQuestion(null);
        setMyAnswer(null);
        setRivalAnswer(null);
        setIsConfirmed(false);
        setStatus('choosing');
      };

      const triggerNextRound = () => {
        startNextRoundLocal();
        if (connRef.current) {
          connRef.current.send({ type: 'NEXT_ROUND' });
        }
      };

      const copyCode = () => {
        navigator.clipboard.writeText(roomId);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="flex flex-col items-center justify-center min-h-screen p-4 sm:p-6 max-w-xl mx-auto">
          {/* LOBBY INICIAL */}
          {status === 'lobby' && (
            <div className="w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 text-center">
              <div className="space-y-2">
                <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">
                  Trivia Online 1v1
                </h1>
                <p className="text-sm text-slate-400">Juega en tiempo real desde cualquier dispositivo.</p>
              </div>

              <div className="space-y-4 text-left">
                <div>
                  <label className="text-xs font-bold uppercase text-slate-400 block mb-1">Tu Nombre</label>
                  <input
                    type="text"
                    placeholder="Ej. Danielo, Valen..."
                    value={myName}
                    onChange={(e) => setMyName(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>

                <button
                  onClick={createRoom}
                  className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg transition"
                >
                  ⚡ Crear Nueva Sala
                </button>

                <div className="flex items-center gap-2 py-2">
                  <div className="flex-1 h-px bg-slate-800"></div>
                  <span className="text-xs text-slate-500 uppercase">o unirse</span>
                  <div className="flex-1 h-px bg-slate-800"></div>
                </div>

                <div className="flex gap-2">
                  <input
                    type="text"
                    placeholder="CÓDIGO DE SALA"
                    value={inputRoomCode}
                    onChange={(e) => setInputRoomCode(e.target.value.toUpperCase())}
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center uppercase font-mono font-bold text-white focus:outline-none focus:ring-2 focus:ring-purple-500"
                  />
                  <button
                    onClick={joinRoom}
                    className="bg-slate-800 hover:bg-slate-700 text-white font-bold px-6 py-3 rounded-xl border border-slate-700"
                  >
                    Unirse
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ESPERANDO JUGADOR 2 */}
          {status === 'waiting' && (
            <div className="w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center space-y-6 shadow-2xl">
              <h2 className="text-2xl font-bold text-white">Esperando al Rival...</h2>
              <p className="text-sm text-slate-400">Comparte el siguiente código para iniciar:</p>

              <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex items-center justify-between">
                <span className="text-3xl font-mono font-black text-indigo-400 tracking-wider">{roomId}</span>
                <button onClick={copyCode} className="bg-indigo-600/20 text-indigo-400 px-4 py-2 rounded-xl text-xs font-bold border border-indigo-500/30">
                  {copied ? '¡Copiado!' : 'Copiar'}
                </button>
              </div>

              <div className="text-xs text-slate-500 animate-pulse">
                Esperando que el segundo jugador ingrese el código...
              </div>
            </div>
          )}

          {/* MARCADOR DEL JUEGO */}
          {(status === 'choosing' || status === 'answering' || status === 'result' || status === 'finished') && (
            <div className="w-full space-y-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-xl grid grid-cols-2 gap-4">
                <div className="bg-indigo-950/40 border border-indigo-500/40 p-3 rounded-2xl text-center">
                  <span className="text-xs text-indigo-400 font-bold block truncate">{myName || 'Tú'} (Tú)</span>
                  <span className="text-3xl font-black text-white">{myScore} <span className="text-xs text-slate-500">/ 5 pts</span></span>
                </div>
                <div className="bg-purple-950/40 border border-purple-500/40 p-3 rounded-2xl text-center">
                  <span className="text-xs text-purple-400 font-bold block truncate">{rivalName || 'Rival'} (Rival)</span>
                  <span className="text-3xl font-black text-white">{rivalScore} <span className="text-xs text-slate-500">/ 5 pts</span></span>
                </div>
              </div>

              {/* FASE A: SELECCIÓN DE CATEGORÍA */}
              {status === 'choosing' && (
                <div className="w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 shadow-xl">
                  {!myCategory ? (
                    <>
                      <div className="text-center">
                        <h3 className="text-xl font-bold text-white">Elige tu Tema</h3>
                        <p className="text-xs text-slate-400 mt-1">Elige un tema (-1 pt si fallas) o gira la ruleta gratis (0 pts si fallas).</p>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        {CATEGORIES.map(cat => (
                          <button
                            key={cat.id}
                            onClick={() => chooseCategory(cat.id, 'chosen')}
                            className="p-4 rounded-2xl bg-slate-950 border border-slate-800 hover:border-indigo-500 text-left font-bold text-sm text-slate-200 transition"
                          >
                            {cat.name}
                          </button>
                        ))}
                      </div>

                      <div className="pt-2 text-center">
                        <button
                          onClick={spinRoulette}
                          disabled={isSpinning}
                          className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg transition"
                        >
                          🎰 {isSpinning ? 'Girando...' : 'Girar Ruleta Gratis (0 pts penalización)'}
                        </button>
                      </div>
                    </>
                  ) : (
                    <div className="text-center py-6 space-y-3">
                      <div className="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-xl font-bold">✓</div>
                      <h3 className="text-xl font-bold text-white">¡Categoría Elegida!</h3>
                      <p className="text-xs text-slate-400">Esperando que {rivalName || 'el rival'} seleccione su tema...</p>
                    </div>
                  )}
                </div>
              )}

              {/* FASE B: PREGUNTAS EN SIMULTÁNEO */}
              {status === 'answering' && (
                <div className="w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 shadow-xl">
                  <div className="flex items-center justify-between bg-slate-950 p-3 rounded-2xl border border-slate-800">
                    <span className="text-xs font-bold uppercase text-indigo-400">
                      Categoría: {CATEGORIES.find(c => c.id === myCategory)?.name}
                    </span>
                    <div className="flex items-center gap-2 bg-slate-900 px-3 py-1 rounded-full border border-slate-700">
                      <span className="text-xs text-slate-400">Tiempo:</span>
                      <span className={`text-base font-mono font-black ${timer <= 5 ? 'text-rose-500' : 'text-amber-400'}`}>
                        {timer}s
                      </span>
                    </div>
                  </div>

                  <div className="text-center py-2">
                    <h3 className="text-xl sm:text-2xl font-bold text-white leading-snug">
                      {myQuestion ? myQuestion.question : 'Cargando pregunta...'}
                    </h3>
                  </div>

                  <div className="grid grid-cols-1 gap-3">
                    {myQuestion?.options.map((opt, idx) => {
                      const isMySelection = myAnswer === idx;

                      return (
                        <button
                          key={idx}
                          disabled={isConfirmed}
                          onClick={() => selectOption(idx)}
                          className={`p-4 rounded-2xl border font-semibold text-left transition flex justify-between items-center ${
                            isMySelection 
                              ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg ring-2 ring-indigo-400/50' 
                              : 'bg-slate-950 border-slate-800 hover:bg-slate-800 text-slate-200'
                          } ${isConfirmed ? 'opacity-80 cursor-default' : 'cursor-pointer'}`}
                        >
                          <span>{opt}</span>
                          <span className="text-xs font-mono text-slate-500">[{String.fromCharCode(65 + idx)}]</span>
                        </button>
                      );
                    })}
                  </div>

                  <div className="pt-2 flex flex-col gap-2 items-center">
                    {!isConfirmed ? (
                      <>
                        <button
                          onClick={confirmFinalAnswer}
                          disabled={myAnswer === null}
                          className={`w-full py-3.5 rounded-xl font-extrabold text-white transition ${
                            myAnswer !== null 
                              ? 'bg-emerald-600 hover:bg-emerald-500 cursor-pointer shadow-lg' 
                              : 'bg-slate-800 opacity-50 cursor-not-allowed'
                          }`}
                        >
                          {myAnswer !== null ? 'Confirmar Respuesta' : 'Elige una opción arriba'}
                        </button>
                        <p className="text-[11px] text-slate-400">Puedes cambiar tu opción seleccionada antes de confirmar o agotar los {timer}s.</p>
                      </>
                    ) : (
                      <div className="text-center py-2">
                        <p className="text-sm font-bold text-emerald-400">✓ Respuesta Enviada</p>
                        <p className="text-xs text-slate-500 mt-1">Esperando que {rivalName || 'el rival'} responda...</p>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* FASE C: RESULTADOS DE LA RONDA */}
              {status === 'result' && (
                <div className="w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-6 shadow-xl">
                  <h3 className="text-2xl font-bold text-white">Resultados de la Ronda</h3>

                  <div className="grid grid-cols-2 gap-4">
                    <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2">
                      <span className="text-xs font-bold text-indigo-400">{myName} (Tú)</span>
                      <p className={`text-sm font-bold ${myAnswer === myQuestion?.answer ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {myAnswer === myQuestion?.answer ? '¡Correcto! (+1 pt)' : 'Incorrecto'}
                      </p>
                    </div>

                    <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2">
                      <span className="text-xs font-bold text-purple-400">{rivalName}</span>
                      <p className="text-sm font-bold text-slate-300">
                        {rivalAnswer !== -1 ? 'Respondió' : 'Sin tiempo'}
                      </p>
                    </div>
                  </div>

                  <button
                    onClick={triggerNextRound}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg transition"
                  >
                    Siguiente Ronda ➔
                  </button>
                </div>
              )}

              {/* FASE D: FIN DEL JUEGO */}
              {status === 'finished' && (
                <div className="w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center space-y-6 shadow-2xl">
                  <h2 className="text-3xl font-black text-white">¡Partida Finalizada!</h2>
                  <p className="text-xl font-bold text-amber-400">
                    🏆 Ganador: {myScore >= 5 ? myName : rivalName}
                  </p>
                  <button
                    onClick={() => window.location.reload()}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg transition"
                  >
                    Volver a Jugar
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
